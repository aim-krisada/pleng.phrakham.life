# ตรวจอัตโนมัติทุกคำขอรวม — ให้พี่เอมเห็นเองว่าเทสผ่านไหม ก่อนกดรับ
#
# ทำไมมีไฟล์นี้ (พี่เอมสั่ง 3 ส.ค. 2569): เดิมเขาต้องเชื่อคำที่ AI รายงานว่า "เทสผ่าน" เพราะไม่มี
# ทางเห็นเอง ไฟล์นี้ทำให้หน้าคำขอรวมขึ้นเครื่องหมายถูกสีเขียวหรือกากบาทแดงเอง ⇒ กดด้วยหลักฐาน
# ไม่ใช่ด้วยความเชื่อใจ · และถ้า AI รายงานผิด ของจริงจะฟ้องเอง
#
# ⛔ ไฟล์นี้ไม่แตะเว็บที่คนใช้ — มันรันเทสอย่างเดียว การขึ้นเว็บยังเป็นหน้าที่ของ deploy.yml
#    ซึ่งทำงานตอนมีของเข้า main เท่านั้น
name: Test

on:
  pull_request:
  workflow_dispatch:

# คำขอรวมใบเดิมถูกดันซ้ำ = ยกเลิกรอบเก่าที่ยังค้าง ไม่ต้องรอผลที่ไม่มีใครอ่านแล้ว
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:all = ทุกอย่างรวมส่วน db/ (pglite) — ตรงกับกฎในคู่มือโปรเจกต์ที่ว่าต้องเขียวก่อนรวม
      # ⛔ ไม่ใช่ `npm test` ซึ่งข้าม db/
      - run: npm run test:all
      # สร้างเว็บให้ผ่านด้วย — เทสเขียวแต่สร้างไม่ผ่านก็ขึ้นเว็บไม่ได้
      - run: npm run build
