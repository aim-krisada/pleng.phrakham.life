name: Deploy to GitHub Pages

# THREE VERSIONS, ONE SITE — root is what people use, and it is built from `main`.
#   /      = `main`             — the live version (v1 codebase). Merged into main == on the site.
#   /v2/   = tag `v2-frozen`    — frozen reference only. Never changes again. Read-only history.
#   /v3/   = branch `v3-dist`   — the redesign. ⚠️ NOT source: it holds the ALREADY-BUILT site.
#                                 May not exist yet; that is fine and must not fail the run.
#                                 Delivered by aimgit, which then fires `repository_dispatch` —
#                                 see the `on:` block for why a push to that branch cannot do it.
#
# WHY /v3/ IS DIFFERENT FROM /v2/ (8 Aug 2026): v3 is a Nuxt app and it lives on aimgit, not here.
# It is built THERE (v3/pleng, job `publish-v3`, which is manual — someone has to press it) and the
# finished files are pushed to `v3-dist`. This repo only serves them, because a custom domain can be
# attached to exactly one repository and this is that repository.
# ⇒ so there is no `npm ci`/`npm run build` for v3 here. Building it here would mean copying both
#   v3's source AND its database key into this repo; delivering the built files does not.
#
# WHY THIS SHAPE (พี่เอมสั่ง 3 ส.ค. 2569 — เขียนไว้กันลืมและกันคนอ่านผิดซ้ำ):
# ก่อนหน้านี้รากสร้างจากแท็ก (`v1-frozen`) ไม่ใช่จาก `main` ⇒ "รวมงานเข้า main" กับ "ขึ้นเว็บ"
# เป็น 2 เรื่องคนละเรื่อง ต้องย้ายแท็กมือทุกรอบ · ลืมย้าย = งานที่รวมแล้วไม่โผล่บนเว็บ และ
# ทุกด่านยังขึ้นเขียวหมด (เกิดจริง 3 ส.ค. 2569: ปุ่มเรียงลำดับของพี่เปารวมแล้วแต่ไปโผล่ที่ /v2
# เสียเวลาตามหาสาเหตุ 1 วัน) ⇒ ตอนนี้รากสร้างจาก `main` ⛔ ห้ามเปลี่ยนกลับไปสร้างจากแท็กอีก
# ของแช่แข็งใช้แท็กได้ แต่ห้ามเป็นราก
on:
  push:
    branches: [main]
  # A delivery of v3 arrives as a push to `v3-dist` — but that CANNOT trigger this file, because
  # GitHub reads the workflow from the ref that was pushed, and `v3-dist` holds the built site only:
  # no .github/ at all. Listing it under `push.branches` would therefore be a lie that reads as
  # working, and the delivery would silently show up on the next unrelated push to main instead.
  # ⇒ aimgit calls the repository_dispatch API right after pushing. That always runs the workflow
  #   file on the DEFAULT branch, which is the copy we can actually see and review.
  repository_dispatch:
    types: [v3-delivered]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do NOT cancel an in-progress deploy: a cancelled
# deploy-pages run can leave the Pages backend mid-deployment, and the next push
# then fails with "Deployment failed, try again later." Let production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---- the live version (root) — from `main` ------------------------------------------------
      # NO continue-on-error here on purpose: if the live version does not build, the run must go
      # red and nothing ships. Shipping a site whose root is missing is worse than not shipping.
      # base is './' (main's vite.config.js), which serves correctly at root.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm ci
        working-directory: live
      - run: npm run build
        working-directory: live

      # ---- frozen reference (/v2/) — from tag `v2-frozen` --------------------------------------
      # A tag, so this build is deterministic and will not change again. continue-on-error keeps a
      # reference build from ever blocking the live version.
      - uses: actions/checkout@v4
        with:
          ref: v2-frozen
          path: v2
      - id: v2install
        continue-on-error: true
        run: npm ci
        working-directory: v2
      - id: v2build
        if: steps.v2install.outcome == 'success'
        continue-on-error: true
        run: npm run build
        working-directory: v2
        env:
          PLENG_V2: '1' # → vite base '/v2/' (v2 codebase reads this)

      # ---- the redesign (/v3/) — already built, delivered on branch `v3-dist` -------------------
      # continue-on-error on the CHECKOUT: `v3-dist` may not exist yet, and a missing branch must
      # not fail the run. No install and no build — the files arrive finished (see header).
      - id: v3checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: v3-dist
          path: v3

      # A delivered site must be able to say which commit it came from, the same way root does.
      # v3's own CI writes version.json; if it is missing, the delivery is not what we expect, so
      # treat it as "no v3 this run" rather than shipping something unidentifiable.
      # ⚠️ Presence of a file is not proof the site works. The reviewer deleted favicon.png,
      # logo.png and the whole _nuxt/ directory from a real build — 11 of 30 files left, index.html
      # untouched — and an earlier version of this check still passed, so a site with no JS and no
      # CSS would have shipped to /v3/ with nothing red on either side.
      # aimgit's tools/build-v3.sh now refuses to push such a build; this is the second line, because
      # this repo must not depend on the sender being correct.
      - id: v3check
        if: steps.v3checkout.outcome == 'success'
        continue-on-error: true
        run: |
          test -f v3/index.html
          test -f v3/version.json
          test -n "$(find v3/_nuxt -name '*.js' -print -quit 2>/dev/null)" \
            || { echo "::error::delivered v3 has no JS in _nuxt — refusing to publish an empty page"; exit 1; }
          # Everything index.html points at must actually be in the delivery.
          for p in $(grep -oE '"/v3/[^"]+"' v3/index.html | tr -d '"' | sort -u); do
            p=${p%%\?*}; case "${p##*/}" in *.*) ;; *) continue ;; esac
            test -f "v3${p#/v3}" || { echo "::error::delivered v3 references $p but the file is missing"; exit 1; }
          done
          echo "delivered v3: $(cat v3/version.json)"

      # ---- combine: root = live's dist, plus /v2 and /v3 nested under it -----------------------
      - name: Nest the reference and work-in-progress builds under the site root
        run: |
          if [ "${{ steps.v2build.outcome }}" = "success" ]; then rm -rf live/dist/v2; cp -r v2/dist live/dist/v2; fi
          # v3 arrives built, so the checkout itself IS the site. Drop the .git that checkout adds —
          # publishing it would put the delivery branch's history on a public web server.
          if [ "${{ steps.v3check.outcome }}" = "success" ]; then rm -rf live/dist/v3; cp -r v3 live/dist/v3; rm -rf live/dist/v3/.git; fi

      # ---- say out loud which commit the root actually carries ---------------------------------
      # This is the line that would have caught the 3 Aug 2026 mix-up in seconds instead of a day.
      - name: Report what is being deployed
        run: |
          echo "root  <- main @ $(git -C live rev-parse --short HEAD)"
          echo "root  : $(ls live/dist | tr '\n' ' ')"
          for d in v2 v3; do
            if [ -d "live/dist/$d" ]; then echo "/$d/  : included"; else echo "/$d/  : NOT included"; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # ---- a delivery that arrived but did not ship must be LOUD -------------------------------
      # Pages replaces the WHOLE site every run. So if `v3-dist` was delivered but failed its check,
      # the upload above simply has no /v3/ in it — and a /v3/ that was working five minutes ago
      # becomes a 404, with every check mark still green because v3check is continue-on-error.
      # (Found by the reviewer on aimgit MR !28, 9 Aug 2026.)
      #
      # This runs AFTER the deployment on purpose: the live root has already shipped, which is the
      # property we must never trade away. All this does is refuse to call the run a success.
      - name: Fail if a v3 delivery arrived but did not make it onto the site
        if: steps.v3checkout.outcome == 'success' && steps.v3check.outcome != 'success'
        run: |
          echo "::error::v3-dist was delivered but failed its check, so /v3/ is NOT on the site."
          echo "The root shipped normally. Fix the delivery on aimgit and press publish-v3 again."
          exit 1
