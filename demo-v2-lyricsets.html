<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>เนื้อร้องหลายชุด (/v2) — preview</title>
  </head>
  <body>
    <!-- EditorMode teleports its title input + menus into these. They must be STATIC DOM
         outside the Vue root — rendering them inside the app makes Vue patch a node whose
         children were teleported away ("Cannot set properties of null (setting '__vnode')")
         and every later update dies with it. index.html does the same via the shell bar. -->
    <div id="shell-title"></div>
    <div id="shell-menus"></div>
    <div id="app"></div>
    <script type="module" src="/src/demoV2LyricSets.js"></script>
  </body>
</html>
