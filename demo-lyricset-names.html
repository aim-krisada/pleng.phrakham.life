<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ชื่อชุดเนื้อร้อง — preview</title>
    <style>
      @font-face{font-family:'Noto Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/NotoSansThai-Regular.woff2') format('woff2')}
      @font-face{font-family:'Noto Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/NotoSansThai-Bold.woff2') format('woff2')}
    </style>
  </head>
  <body>
    <!-- EditorMode teleports its title input + menus into these. They must be STATIC DOM
         outside the Vue root — rendering them inside the app makes Vue patch a node whose
         children were teleported away ("Cannot set properties of null (setting '__vnode')")
         and every later update dies with it. index.html does the same via the shell bar. -->
    <div id="shell-title"></div>
    <div id="shell-menus"></div>
    <div id="app"></div>
    <script type="module" src="/src/demoLyricSetNames.js"></script>
  </body>
</html>
